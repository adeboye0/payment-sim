<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pay</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: #f3efe6;
      color: #1c1915;
    }
    main {
      width: min(400px, calc(100% - 40px));
      padding: 32px 32px 28px;
      background: #fffdf8;
      border: 1px solid #e6dccb;
      border-radius: 16px;
      box-shadow: 0 16px 40px rgba(28, 25, 21, 0.06);
    }
    .eyebrow {
      margin: 0;
      font-size: 0.75rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #8a8175;
    }
    .amount {
      margin: 8px 0 0;
      font-size: 2.5rem;
      line-height: 1.1;
      font-weight: 600;
      letter-spacing: -0.03em;
    }
    .reference {
      margin: 10px 0 0;
      font-family: Consolas, "Courier New", monospace;
      font-size: 0.8rem;
      color: #8a8175;
    }
    .status {
      display: inline-block;
      margin: 20px 0 0;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.75rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      background: #f3efe6;
      color: #6f675e;
    }
    .status[data-status="pending"],
    .status[data-status="processing"] { background: #f8efd8; color: #8a5a12; }
    .status[data-status="success"] { background: #e5f2e8; color: #1f6b3a; }
    .status[data-status="failed"] { background: #f8e6e4; color: #8d2e2e; }
    .status[data-status="abandoned"] { background: #eeeae4; color: #6f675e; }
    .resolving {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 20px 0 0;
      color: #8a5a12;
      font-size: 0.85rem;
    }
    .resolving[hidden] { display: none; }
    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid #f0e2c4;
      border-top-color: #8a5a12;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .actions {
      display: grid;
      gap: 8px;
      margin-top: 28px;
    }
    button {
      height: 44px;
      border-radius: 10px;
      border: 1px solid #1c1915;
      background: #1c1915;
      color: #fffdf8;
      font: inherit;
      font-size: 0.95rem;
      cursor: pointer;
    }
    button.secondary {
      background: transparent;
      color: #1c1915;
    }
    button.danger {
      background: transparent;
      color: #8d2e2e;
      border-color: #e7c6c2;
    }
    button:disabled { opacity: 0.45; cursor: default; }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Amount due</p>
    <p class="amount" id="amount"></p>
    <p class="reference" id="reference">Loading payment</p>
    <p class="status" id="message"></p>
    <p class="resolving" id="loader" hidden>
      <span class="spinner" aria-hidden="true"></span>
      Resolving payment
    </p>
    <div class="actions">
      <button id="pay" type="button" disabled>Pay now</button>
      <button id="fail" class="danger" type="button" disabled>Fail payment</button>
      <button id="cancel" class="secondary" type="button" disabled>Cancel payment</button>
    </div>
  </main>
  <script>
    const reference = location.pathname.split("/").filter(Boolean).pop();
    const referenceEl = document.getElementById("reference");
    const amountEl = document.getElementById("amount");
    const messageEl = document.getElementById("message");
    const loader = document.getElementById("loader");
    const payButton = document.getElementById("pay");
    const failButton = document.getElementById("fail");
    const cancelButton = document.getElementById("cancel");
    const labels = {
      pending: "Pending",
      processing: "Processing",
      success: "Paid",
      failed: "Failed",
      abandoned: "Cancelled",
    };
    const terminal = new Set(["success", "failed", "abandoned"]);
    let pollTimer;

    function stopPolling() {
      if (!pollTimer) return;
      clearInterval(pollTimer);
      pollTimer = null;
    }

    function startPolling() {
      if (pollTimer) return;
      pollTimer = setInterval(load, 200);
    }

    function setResolving(on) {
      loader.hidden = !on;
      messageEl.hidden = on;
    }

    function show(payment) {
      referenceEl.textContent = payment.reference;
      amountEl.textContent = new Intl.NumberFormat("en-US", {
        style: "currency",
        currency: payment.currency || "USD",
      }).format(payment.amount);
      messageEl.textContent = labels[payment.status] || payment.status;
      messageEl.dataset.status = payment.status;
      setResolving(payment.status === "processing");
      const started = payment.status !== "pending";
      payButton.disabled = started;
      failButton.disabled = started;
      cancelButton.disabled = started;
      if (payment.status === "processing") startPolling();
      if (terminal.has(payment.status)) stopPolling();
    }

    async function load() {
      const response = await fetch("/pay/" + encodeURIComponent(reference) + "/status");
      const body = await response.json();
      if (!response.ok) {
        referenceEl.textContent = "Payment not found";
        amountEl.textContent = "";
        messageEl.textContent = body.data && body.data.message ? body.data.message : "Payment not found";
        messageEl.dataset.status = "failed";
        setResolving(false);
        payButton.disabled = true;
        failButton.disabled = true;
        cancelButton.disabled = true;
        stopPolling();
        return null;
      }
      show(body.data);
      return body.data;
    }

    async function settle(path) {
      payButton.disabled = true;
      failButton.disabled = true;
      setResolving(true);
      const response = await fetch("/pay/" + encodeURIComponent(reference) + path, { method: "POST" });
      const body = await response.json();
      if (response.ok) show(body.data);
    }

    payButton.addEventListener("click", () => settle("/confirm"));
    failButton.addEventListener("click", () => settle("/fail"));

    cancelButton.addEventListener("click", async () => {
      cancelButton.disabled = true;
      const response = await fetch("/pay/" + encodeURIComponent(reference) + "/cancel", { method: "POST" });
      const body = await response.json();
      if (response.ok) show(body.data);
    });

    load().then((payment) => {
      if (payment && payment.status === "processing") startPolling();
    });
  </script>
</body>
</html>
